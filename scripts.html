{cat:'ins', long:true, title:'香港储蓄分红险，一篇讲透底层逻辑', plat:'视频号 · 公众号 · B站', dur:'约3分钟', lines:[
 ['0:00-0:20 钩子','如果你正在考虑香港的储蓄分红险，又怕被销售忽悠，那这3分钟，我帮你把它的底层逻辑一次讲透。先收藏，慢慢看。'],
 ['0:20-1:00 本质','香港储蓄分红险，说白了就是一份「美元计价 + 长期复利」的储蓄保单。它的收益分两部分：一部分是保证的现金价值，写进合同，确定能拿；另一部分是非保证的分红，取决于保险公司的投资回报。'],
 ['1:00-1:40 关键指标','判断一家公司靠不靠谱，就盯一个数字——分红实现率。它衡量的是「承诺的分红，实际兑现了多少」。香港保监局强制要求所有公司披露，你上官网就能查。一家公司如果近十年实现率都稳定在95%以上，说明它「说到的，基本做到了」。'],
 ['1:40-2:20 适合谁','它适合谁？手里有一笔长期不动的钱，想对冲人民币汇率波动、做美元资产配置的人。它不适合谁？三五年内可能要动用这笔钱的人——因为前期退保大概率亏损，这是它「长期属性」的代价。'],
 ['2:20-2:50 风险提示','记住三点风险：分红是不确定的、前几年退保会亏、必须本人赴港签约。别信「稳赚」「保本高收益」这种话。'],
 ['2:50-3:00 落点','如果你想把计划书上的数字看清楚，评论区扣「实现率」，我发你一份主流公司近十年的分红实现率对照表，自己一查便知。']
]},
{cat:'news', long:true, title:'家庭资产配置的「四笔钱」框架', plat:'视频号 · 公众号 · B站', dur:'约3分钟', lines:[
 ['0:00-0:20 钩子','为什么有人月薪很高却存不下钱，有人收入一般却越过越稳？差别不在收入，在「钱的分配」。今天用3分钟，教你一个能直接套用的家庭资产框架。'],
 ['0:20-1:00 总览','把家里的钱分成四笔：第一笔「要花的钱」，就是3-6个月的生活费，求的是随时能取；第二笔「保命的钱」，就是健康保障，用来兜住意外和疾病。'],
 ['1:00-1:50 后两笔','第三笔「生钱的钱」，是拿来博收益的，比如股票基金，追求增值，但要能承受波动；第四笔「保本增值的钱」，是给未来确定要用的钱——养老、教育——找长期稳健的工具，比如储蓄险、国债。'],
 ['1:50-2:30 顺序','顺序很重要：先留够要花的钱，再配齐保命的钱，之后才轮到生钱和保本增值。很多人的问题是顺序反了——先把钱全投进高风险的，一旦出事，满盘皆输。'],
 ['2:30-2:50 原则','四笔钱没有固定比例，但有一个原则：短期要用的求流动，中期兜底求保障，长期增值求复利。按这个分，你就不会慌。'],
 ['2:50-3:00 落点','想让我帮你按自己的情况，把四笔钱的比例排一下？评论区扣「四笔钱」，我帮你理一理。']
]},
{cat:'ins', long:true, title:'香港重疾险，从挑选到理赔一次讲清', plat:'视频号 · 公众号 · B站', dur:'约3分钟', lines:[
 ['0:00-0:20 钩子','香港重疾险到底值不值得买？网上吵翻了天。这3分钟，我把它的优点、缺点、以及最关键的三个坑，全部摊开讲。'],
 ['0:20-1:00 优点','先说优点。第一，保额带分红，会随年份增长，能对抗通胀——这是它最大的价值；第二，全球理赔，在哪确诊都能赔；第三，不少产品支持多次赔付，覆盖复发、新发。'],
 ['1:00-1:40 缺点','再说缺点。第一，必须本人赴港签约，有时间和交通成本；第二，以美元计价，存在汇率波动；第三，对健康告知要求极严，任何既往症都要如实申报，否则可能拒赔。'],
 ['1:40-2:20 三个坑','三个坑要避开：一是健康告知隐瞒，这是理赔纠纷的最大来源；二是盲目追求「多次赔付」，加了不必要的保费；三是忽略保额通胀设计，选了不带分红的「便宜」产品。'],
 ['2:20-2:50 怎么选','怎么选？先看健康状况能不能过核保，再看预算，最后看家庭责任。家庭顶梁柱优先，孩子次之。保额要能覆盖3-5年的家庭开销。'],
 ['2:50-3:00 落点','想知道自己的情况适不适合香港重疾险？评论区扣「重疾」，我帮你做个免费的需求分析。']
]},
{cat:'news', long:true, title:'美元保单，到底适合谁？', plat:'视频号 · 公众号 · B站', dur:'约3分钟', lines:[
 ['0:00-0:20 钩子','「美元保单」最近很火，但90%的人没搞懂它到底解决什么问题。这3分钟，我把它的真实逻辑讲清楚，别盲目跟风。'],
 ['0:20-1:00 本质','美元保单的核心，不是「收益高」，而是「货币分散」。它的收益来源是美元资产，等于把你的钱，从单一的人民币，变成一部分美元计价。这能对冲一件事：人民币汇率长期波动的风险。'],
 ['1:00-1:40 谁适合','适合三类人：一是有子女海外留学、未来要用美元的人；二是有跨境业务或海外生活规划的人；三是想给家庭资产做「分仓」、分散单一货币风险的中产以上家庭。'],

 ['2:20-2:50 关键提醒','关键提醒：买美元保单，一样要看分红实现率，别被演示收益冲昏头。而且要用「长期不动的闲钱」来配，比例量力而行。'],

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function render(filter){
  const grid = document.getElementById('grid');
  let list = SCRIPTS;
  if(filter==='long'){ list = SCRIPTS.filter(s=>s.long); }
  else if(filter!=='all'){ list = SCRIPTS.filter(s=>s.cat===filter); }
  grid.innerHTML = list.map((s,i)=>{
    const c = CAT[s.cat];
    const lines = s.lines.map(l=>
      '<div class="line"><span class="t">['+esc(l[0])+']</span>'+esc(l[1])+'</div>'
    ).join('');
    const raw = s.title+'\n\n'+s.lines.map(l=>'【'+l[0]+'】'+l[1]).join('\n');
    const longTag = s.long ? '<span class="cat-tag long">长视频 · 深度详解</span>' : '';
    return '<div class="card"'+(s.long?' long':'')+"'>"
      +'<div class="card-top">'
        +'<span class="cat-tag '+c.cls+'">'+c.label+'</span>'+longTag
        +'<h3>'+esc(s.title)+'</h3>'
        +'<div class="card-meta"><span class="meta">'+esc(s.plat)+'</span><span class="meta">'+esc(s.dur)+'</span></div>'
      +'</div>'
      +'<div class="card-body">'+lines+'</div>'
      +'<div class="card-foot"><button class="copy-btn" onclick="copy(this)" data-raw="'+encodeURIComponent(raw)+'">复制整套脚本</button></div>'
      +'</div>';
  }).join('');
  if(!list.length){ grid.innerHTML = '<div class="empty">该分类暂无内容</div>'; }
}

function copy(btn){
  const txt = decodeURIComponent(btn.getAttribute('data-raw'));
  const done = ()=>{ btn.textContent='已复制 ✓'; btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='复制整套脚本'; btn.classList.remove('ok');},1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done));
  } else fallback(txt,done);
}
function fallback(txt,done){
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy'); done();}catch(e){}
  document.body.removeChild(ta);
}

document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('.fbtn'); if(!b) return;
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  render(b.dataset.cat);
});

render('all');
</script>
